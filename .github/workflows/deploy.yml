name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 25 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드
        run: docker build -t petshop-prod .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag petshop-prod ${{ secrets.ECR_REPOSITORY_URI }}:latest

      - name: ECR에 Docker 이미지 push
        run: docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest

      - name: SSH 키 등록
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: EC2 배포 (pull & restart)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }} &&
            docker pull ${{ secrets.ECR_REPOSITORY_URI }}:latest &&
            docker stop petshop-prod || true &&
            docker rm petshop-prod || true &&
            docker run -d -p 8080:8080 --name petshop-prod \
              --log-driver=awslogs \
              --log-opt awslogs-region=${{ secrets.AWS_REGION }} \
              --log-opt awslogs-group=/petshop/prod \
              --log-opt awslogs-create-group=true \
              ${{ secrets.ECR_REPOSITORY_URI }}:latest
          '
